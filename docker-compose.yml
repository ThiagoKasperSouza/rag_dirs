services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-mcp-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST / gRPC
      - "6334:6334"   # dashboard
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT__SERVICE__API_KEY:-}"

volumes:
  qdrant_storage:
